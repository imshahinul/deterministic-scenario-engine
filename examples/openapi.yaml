openapi: 3.0.3
info:
  title: Deterministic order integration spike
  version: "0.8"
paths:
  /orders:
    post:
      operationId: createOrder
      parameters:
        - in: header
          name: X-Customer-ID
          required: true
          schema: {type: string}
        - in: query
          name: source
          required: false
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_number, customer_email, quantity, note]
              properties:
                order_number: {type: string}
                customer_email: {type: string, format: email}
                quantity: {type: integer, minimum: 1, maximum: 20}
                note: {type: string}
                coupon: {type: string}
      responses:
        "201": {description: Order created}
