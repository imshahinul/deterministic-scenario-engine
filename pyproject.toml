[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-scenario-engine"
dynamic = ["version"]
description = "Reproducible, state-consistent business scenarios with deterministic ground truth"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["deterministic", "scenario", "testing", "fixtures", "replay"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
pytest = ["pytest>=9.1,<10"]
sqlalchemy = ["SQLAlchemy>=2.0,<3"]
hypothesis = ["hypothesis>=6,<7"]
schemathesis = ["hypothesis>=6,<7", "schemathesis>=4,<5"]

[project.entry-points.pytest11]
scenario_engine = "scenario_engine.pytest_plugin"

[tool.setuptools.dynamic]
version = {attr = "scenario_engine._version.VERSION"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["scenario_engine*"]
namespaces = false

[tool.unittest]
start-directory = "tests"
